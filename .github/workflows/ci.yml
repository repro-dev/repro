name: Build, test and deploy (split)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "**"
    tags:
      - "v*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build, check & test
    runs-on: ubuntu-latest
    outputs:
      app_ids: ${{ steps.list-affected.outputs.app_ids }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Moon toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-17

      # Find the PostgreSQL bin directory and add it to the PATH
      - name: Add PostgreSQL bin directory to PATH
        run: |
          PG_BIN_DIR=$(pg_config --bindir)
          echo "Found PostgreSQL bin directory: $PG_BIN_DIR"
          echo "$PG_BIN_DIR" >> $GITHUB_PATH
        shell: bash # Explicitly use bash for command substitution

      # Verify that the command is now available
      - name: Verify initdb is in PATH
        run: |
          which initdb
          initdb --version # Example command using the newly available tool

      - name: Check for duplicate migration timestamp prefixes
        run: |
          # Fail if two migration files share the same 14-digit timestamp prefix.
          # Timestamps are the first field when splitting on '-', so we extract them
          # with parameter expansion compatible with Bash 3.2+.
          MIGRATION_DIR="apps/api-server/src/migrations/data"
          seen=""
          duplicates=""
          for f in "$MIGRATION_DIR"/*.sql; do
            base=$(basename "$f")
            prefix="${base%%-*}"
            if echo "$seen" | grep -qF "$prefix"; then
              duplicates="$duplicates $base"
            else
              seen="$seen $prefix"
            fi
          done
          if [ -n "$duplicates" ]; then
            echo "ERROR: Duplicate migration timestamp prefix(es) detected:$duplicates" >&2
            exit 1
          fi
          echo "Migration timestamp collision check passed."

      - name: Check test file sizes
        run: |
          bash scripts/check-test-file-size.sh --warn-only --error-threshold 500 --warn-threshold 400

      - name: Set PNPM store directory
        run: |
          pnpm config set store-dir ~/.pnpm-store

      - name: Get cached PNPM store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --reporter=silent

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run tooling config regression test
        run: pnpm run test:tooling-config

      - name: Get Moon cache
        uses: actions/cache@v3
        with:
          path: .moon/cache
          key: ${{ runner.os }}-moon-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-moon-

      - name: Get base and head for affected commands
        id: vars
        run: |
          git fetch origin main --depth=2
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "MOON_BASE=HEAD~1" >> $GITHUB_ENV
            echo "MOON_HEAD=HEAD" >> $GITHUB_ENV
          else
            echo "MOON_BASE=origin/main" >> $GITHUB_ENV
            echo "MOON_HEAD=${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Check affected packages
        run: |
          echo '::group::Moon pipeline — build, typecheck, test'
          moon ci :build :typecheck :test
          echo '::endgroup::'
        env:
          MOON_LOG: warn
          NODE_OPTIONS: "--test-reporter spec"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.run_number }}
          path: apps/*/dist

      - name: List affected apps
        id: list-affected
        run: |
          echo "app_ids=$(moon query projects --affected --tags type.app | jq -c '[.projects[].id]')" >> $GITHUB_OUTPUT

  e2e:
    name: Playwright E2E
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Moon toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Set PNPM store directory
        run: |
          pnpm config set store-dir ~/.pnpm-store

      - name: Get cached PNPM store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --reporter=silent

      - name: Get Moon cache
        uses: actions/cache@v3
        with:
          path: .moon/cache
          key: ${{ runner.os }}-moon-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-moon-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Install ctlptl
        run: |
          mkdir -p tmp/ci-bin
          curl -fsSL "https://github.com/tilt-dev/ctlptl/releases/download/v0.8.43/ctlptl.0.8.43.linux.x86_64.tar.gz" -o tmp/ctlptl.0.8.43.linux.x86_64.tar.gz
          echo "46c7b0c53213a141ef0bae8838d50ad35461406b0e884a8b1387ed12a9e5da95  tmp/ctlptl.0.8.43.linux.x86_64.tar.gz" | sha256sum -c -
          tar -xzf tmp/ctlptl.0.8.43.linux.x86_64.tar.gz -C tmp/ci-bin ctlptl
          tmp/ci-bin/ctlptl version

      - name: Install portless
        run: |
          npm install --global portless@0.7
          portless --version

      - name: Start local cluster
        run: PATH="$PWD/tmp/ci-bin:$PATH" ./bin/reproctl cluster up

      - name: Start workspace services
        run: ./bin/reproctl start --wait --timeout 300s workspace

      - name: Seed the test database
        run: ./bin/reproctl db seed

      - name: Run Playwright E2E tests
        run: pnpm exec playwright test --project chromium

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  format-check:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Moon toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Set PNPM store directory
        run: |
          pnpm config set store-dir ~/.pnpm-store

      - name: Get cached PNPM store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --reporter=silent

      - name: Build oxlint plugin (if present)
        run: |
          if [ -f "packages/oxlint-plugin-design/package.json" ]; then
            pnpm -C packages/oxlint-plugin-design run build
          fi

      - name: Run workspace lint (Oxlint)
        run: pnpm run lint

      - name: Run Impeccable design-slop detector
        run: npx impeccable detect apps/ packages/ --json

      - name: Check formatting (Prettier)
        run: pnpm run fmt:check

  containerize:
    name: Build container image
    needs: [build, format-check]
    runs-on: ubuntu-latest
    outputs:
      registry_image: ${{ steps.image.outputs.registry_image }}
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.build.outputs.app_ids), 'repro/api-server') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set registry image
        id: image
        run: |
          echo "registry_image=${CONTAINER_REGISTRY_ENDPOINT}/repro:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        env:
          CONTAINER_REGISTRY_ENDPOINT: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build base Docker image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/repro:build-cache
          cache-to: type=registry,ref=${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/repro:build-cache
          tags: ${{ steps.image.outputs.registry_image }}
          file: infra/Dockerfile
          push: true

  deploy-api-server:
    name: Deploy api-server (api)
    needs: [build, containerize]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.build.outputs.app_ids), 'repro/api-server') }}
    environment:
      name: api-staging
      url: https://api.reproqa.dev
    steps:
      - name: Initialize Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          save-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Update api-server container image
        run: |
          scw container container update "$SCW_CONTAINER_ID" region="$SCW_REGION" registry-image="$REGISTRY_IMAGE"
        env:
          SCW_CONTAINER_ID: ${{ secrets.SCW_API_CONTAINER_ID }}
          SCW_REGION: ${{ vars.SCW_REGION || 'fr-par' }}
          REGISTRY_IMAGE: ${{ needs.containerize.outputs.registry_image }}

  deploy-admin:
    name: Deploy admin (app)
    needs: [build, format-check]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.build.outputs.app_ids), 'repro/admin') }}
    environment:
      name: admin-staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy-static-app
        with:
          build-env: production
          app-name: admin
          repro-workspace-url: https://app.reproqa.dev
          repro-admin-url: https://admin.reproqa.dev
          repro-api-url: https://api.reproqa.dev
          paddle-environment: production
          auth-storage: local-storage
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          bucket-name: ${{ secrets.SCW_STATIC_BUCKET_NAME }}

  deploy-workspace:
    name: Deploy workspace (app)
    needs: [build, format-check]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.build.outputs.app_ids), 'repro/workspace') }}
    environment:
      name: workspace-staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy-static-app
        with:
          build-env: production
          app-name: workspace
          repro-workspace-url: https://app.reproqa.dev
          repro-admin-url: https://admin.reproqa.dev
          repro-api-url: https://api.reproqa.dev
          paddle-client-token: ${{ secrets.PADDLE_CLIENT_TOKEN }}
          paddle-environment: production
          auth-storage: local-storage
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          bucket-name: ${{ secrets.SCW_STATIC_BUCKET_NAME }}

  deploy-marketing:
    name: Deploy marketing (pages)
    needs: [build, format-check]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.build.outputs.app_ids), 'repro/marketing')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Moon toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Set PNPM store directory
        run: |
          pnpm config set store-dir ~/.pnpm-store

      - name: Get cached PNPM store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --reporter=silent

      - name: Run marketing tests
        run: moon run repro/marketing:test

      - name: Run marketing typecheck
        run: moon run repro/marketing:typecheck

      - name: Build marketing export
        run: moon run repro/marketing:build --force

      - name: Add Jekyll bypass marker
        run: touch apps/marketing/out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-capture:
    name: Deploy capture (extension)
    needs: [build, format-check]
    runs-on: ubuntu-latest
    if: ${{ contains(fromJSON(needs.build.outputs.app_ids), 'repro/capture') }}
    steps:
      - name: Log
        run: |
          echo "Deploying capture (extension)"

  deploy-dev-toolbar:
    name: Deploy dev-toolbar (extension)
    needs: [build, format-check]
    runs-on: ubuntu-latest
    if: ${{ contains(fromJSON(needs.build.outputs.app_ids), 'repro/dev-toolbar') }}
    steps:
      - name: Log
        run: |
          echo "Deploying dev-toolbar (extension)"
