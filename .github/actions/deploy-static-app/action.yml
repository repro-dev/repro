name: Deploy static app

inputs:
  build-env:
    type: string
    required: true
  app-name:
    type: string
    required: true
  access-key:
    type: string
    required: true
  secret-key:
    type: string
    required: true
  project-id:
    type: string
    required: true
  organization-id:
    type: string
    required: true
  bucket-name:
    type: string
    required: true
  repro-app-url:
    type: string
    required: false
    default: ""
  repro-workspace-url:
    type: string
    required: false
    default: ""
  repro-admin-url:
    type: string
    required: false
    default: ""
  repro-api-url:
    type: string
    required: false
    default: ""
  paddle-client-token:
    type: string
    required: false
    default: ""
  paddle-environment:
    type: string
    required: false
    default: ""
  auth-storage:
    type: string
    required: false
    default: ""
  region:
    type: string
    required: false
    default: fr-par

outputs:
  deployment-url:
    description: The URL of the deployed app
    value: ${{ steps.vars.outputs.deployment-url }}

runs:
  using: composite
  steps:
    - name: Validate deployment inputs
      run: |
        if [ -z "$SCW_BUCKET_NAME" ]; then
          echo "::error::SCW_STATIC_BUCKET_NAME is empty. Set the secret before running static deploys."
          exit 1
        fi
      shell: bash
      env:
        SCW_BUCKET_NAME: ${{ inputs.bucket-name }}

    - name: Validate credentials
      run: |
        if [ -z "$SCW_ACCESS_KEY" ]; then
          echo "::error::SCW_ACCESS_KEY is not set. Add it as a GitHub secret and map it via env: in the workflow."
          exit 1
        fi
        if [ -z "$SCW_SECRET_KEY" ]; then
          echo "::error::SCW_SECRET_KEY is not set. Add it as a GitHub secret and map it via env: in the workflow."
          exit 1
        fi
        if [ -z "$SCW_BUCKET_NAME" ]; then
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::bucket-name is not set. Configure SCW_STATIC_BUCKET_NAME for production deploys."
            exit 1
          fi

          echo "::notice::bucket-name is not set. Skipping static deploy for this non-production run."
          echo "SKIP_STATIC_DEPLOY=true" >> "$GITHUB_ENV"
        fi
      shell: bash
      env:
        SCW_ACCESS_KEY: ${{ inputs.access-key }}
        SCW_SECRET_KEY: ${{ inputs.secret-key }}
        SCW_BUCKET_NAME: ${{ inputs.bucket-name }}

    - name: Validate deployment target
      id: deploy-config
      run: |
        if [ -n "$BUCKET_NAME" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$GITHUB_REF_NAME" = "main" ]; then
          echo "::error::SCW_STATIC_BUCKET_NAME is not set. Add it as a GitHub secret before deploying main."
          exit 1
        fi

        echo "enabled=false" >> "$GITHUB_OUTPUT"
        echo "::notice title=Static deploy skipped::SCW_STATIC_BUCKET_NAME is not configured, so the branch preview deploy was skipped."
      shell: bash
      env:
        BUCKET_NAME: ${{ inputs.bucket-name }}

    - name: Set variables
      id: vars
      run: |
        case $GITHUB_EVENT_NAME in
          push)
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              case "${{ inputs.app-name }}" in
                workspace)
                  BASE_ORIGIN="https://app.reproqa.dev"
                  ;;
                admin)
                  BASE_ORIGIN="https://admin.reproqa.dev"
                  ;;
                *)
                  BASE_ORIGIN="https://${{ inputs.app-name }}.reproqa.dev"
                  ;;
              esac
              BASE_PATH=""
            else
              BASE_ORIGIN="https://${{ inputs.app-name }}.env.reproqa.dev"
              BASE_PATH="/branch/$(echo "$GITHUB_REF_NAME" | sed 's/\//_/g')"
            fi
            ;;

          pull_request)
            BASE_ORIGIN="https://${{ inputs.app-name }}.env.reproqa.dev"
            BASE_PATH="/pull/${{ github.event.number }}"
            ;;

          *)
            BASE_ORIGIN="https://app.reproqa.dev"
            BASE_PATH=""
            ;;
        esac

        echo "base-origin=${BASE_ORIGIN}" >> "$GITHUB_OUTPUT"
        echo "base-path=${BASE_PATH}" >> "$GITHUB_OUTPUT"
        echo "deployment-url=${BASE_ORIGIN}${BASE_PATH}" >> "$GITHUB_OUTPUT"

        # S3 destination key prefix: <app-name> for root, or <app-name><base-path> for branches/PRs
        if [ -z "$BASE_PATH" ]; then
          S3_PREFIX="${{ inputs.app-name }}"
        else
          S3_PREFIX="${{ inputs.app-name }}${BASE_PATH}"
        fi
        echo "s3-prefix=${S3_PREFIX}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Initialize Scaleway CLI
      if: env.SKIP_STATIC_DEPLOY != 'true'
      uses: scaleway/action-scw@v0
      with:
        save-config: true
        access-key: ${{ inputs.access-key }}
        secret-key: ${{ inputs.secret-key }}
        default-project-id: ${{ inputs.project-id }}
        default-organization-id: ${{ inputs.organization-id }}

    - name: Download artifacts
      if: env.SKIP_STATIC_DEPLOY != 'true'
      uses: actions/download-artifact@v5
      with:
        name: build-artifacts-${{ github.run_number }}
        path: apps

    - name: Prepare environment
      if: env.SKIP_STATIC_DEPLOY != 'true'
      run: |
        if [ ! -f "apps/${{ inputs.app-name }}/scripts/prepare-env" ]; then
          # Some static apps do not need deploy-time env templating.
          exit 0
        fi

        if [ -n "$REPRO_APP_URL_INPUT" ]; then
          export REPRO_APP_URL="$REPRO_APP_URL_INPUT"
        else
          export REPRO_APP_URL="$DEPLOYMENT_URL"
        fi

        "./apps/${{ inputs.app-name }}/scripts/prepare-env"
      shell: bash
      env:
        BUILD_ENV: ${{ inputs.build-env }}
        DEPLOYMENT_URL: ${{ steps.vars.outputs.deployment-url }}
        REPRO_APP_URL_INPUT: ${{ inputs.repro-app-url }}
        REPRO_WORKSPACE_URL: ${{ inputs.repro-workspace-url }}
        REPRO_ADMIN_URL: ${{ inputs.repro-admin-url }}
        # API previews are not enabled yet, so branch previews still point at the staged API.
        REPRO_API_URL: ${{ inputs.repro-api-url }}
        PADDLE_CLIENT_TOKEN: ${{ inputs.paddle-client-token }}
        PADDLE_ENVIRONMENT: ${{ inputs.paddle-environment }}
        AUTH_STORAGE: ${{ inputs.auth-storage }}

    - name: Upload hashed assets to S3
      if: env.SKIP_STATIC_DEPLOY != 'true'
      # Upload everything except index.html with long-lived immutable cache headers.
      # Hashed filenames (e.g. main.abc123.js) mean these files are safe to cache forever.
      run: |
        aws s3 sync \
          "apps/${{ inputs.app-name }}/dist/" \
          "s3://${{ inputs.bucket-name }}/${{ steps.vars.outputs.s3-prefix }}/" \
          --endpoint-url "https://s3.${{ inputs.region }}.scw.cloud" \
          --exclude "index.html" \
          --exclude "*.template.html" \
          --cache-control "public, max-age=31536000, immutable" \
          --delete
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-key }}
        AWS_DEFAULT_REGION: ${{ inputs.region }}

    - name: Upload index.html to S3
      if: env.SKIP_STATIC_DEPLOY != 'true'
      # Upload index.html separately with a short TTL so the entry point always reflects
      # the latest deployment without requiring a cache bust on the URL itself.
      run: |
        aws s3 cp \
          "apps/${{ inputs.app-name }}/dist/index.html" \
          "s3://${{ inputs.bucket-name }}/${{ steps.vars.outputs.s3-prefix }}/index.html" \
          --endpoint-url "https://s3.${{ inputs.region }}.scw.cloud" \
          --cache-control "public, max-age=60" \
          --content-type "text/html; charset=utf-8"
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-key }}
        AWS_DEFAULT_REGION: ${{ inputs.region }}

    - name: Invalidate CDN cache
      if: env.SKIP_STATIC_DEPLOY != 'true'
      # Scaleway CDN invalidation purges cached objects so users receive the new index.html
      # immediately. This is best-effort — a failure here does not block deployment.
      run: |
        scw cdn invalidation create \
          origin-id="${{ inputs.app-name }}" \
          paths="/${{ steps.vars.outputs.s3-prefix }}/index.html" \
          region="${{ inputs.region }}" \
          2>/dev/null || echo "CDN invalidation skipped (not configured or unavailable)"
      shell: bash

    - name: Report deployment URL
      if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
      run: |
        echo "::notice title=Deployed::${{ inputs.app-name }} deployed to ${{ steps.vars.outputs.deployment-url }}"
      shell: bash

    - name: Report skipped deployment
      if: ${{ steps.deploy-config.outputs.enabled != 'true' }}
      run: |
        echo "::notice title=Deploy skipped::${{ inputs.app-name }} branch preview deploy skipped because SCW_STATIC_BUCKET_NAME is not configured."
      shell: bash
