id: repro/api-server
language: typescript
layer: application
tags:
  - type.app
  - build.docker
  - role.api
tasks:
  serve:
    command: pnpm run start
    deps:
      - ^:build
  worker-outbox:
    command: pnpm run worker:outbox
    deps:
      - ^:build
    preset: server
  start-mailpit:
    command: mailpit
    toolchain: system
    preset: server
  dev:
    command: pnpm run dev-watch
    deps:
      - ^:build
    preset: server
toolchains:
  default: node
