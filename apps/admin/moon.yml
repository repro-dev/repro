id: repro/admin
language: typescript
layer: application
tags:
  - type.app
  - build.static
  - role.ui
tasks:
  build:
    command: pnpm run build
  dev:
    command: pnpm run dev-serve
    deps:
      - ^:build
      - prepare-env
    preset: server
  serve:
    command: pnpm run serve
    deps:
      - build
      - prepare-env
    preset: server
  prepare-env:
    command: pnpm run prepare-env
    deps:
      - build
    options:
      cache: false
  lint:
    command: pnpm run lint
    deps:
      - ^:build
  typecheck:
    command: pnpm run typecheck
    deps:
      - ^:build
toolchains:
  default: node
