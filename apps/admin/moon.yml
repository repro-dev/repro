id: repro/admin
language: typescript
layer: application
tags:
  - type.app
  - build.static
  - role.ui
tasks:
  build:
    command: pnpm run build
  dev:
    command: pnpm run dev-serve
    deps:
      - ^:build
    preset: server
  lint:
    command: pnpm run lint
    deps:
      - ^:build
  typecheck:
    command: pnpm run typecheck
    deps:
      - ^:build
toolchains:
  default: node
