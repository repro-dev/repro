id: repro/admin
language: typescript
layer: application
tags:
- type.app
- build.static
tasks:
  build:
    command: pnpm run build
    deps:
    - ^:build
    outputs:
    - dist
    options:
      cache: true
  dev:
    command: pnpm run dev-serve
    deps:
    - ^:build
    preset: server
toolchains:
  default: node
