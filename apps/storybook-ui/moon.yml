id: repro/storybook-ui
language: typescript
layer: application
tags:
- type.app
- build.static
tasks:
  build:
    command: pnpm run build
    deps:
    - ^:build
    outputs:
    - storybook-static
    options:
      cache: true
  dev:
    command: pnpm run storybook
  test:
    command: pnpm test
    deps:
    - ^:build
    env:
      NODE_OPTIONS: ''
    options:
      cache: true
      mergeDeps: replace
      mergeEnv: replace
toolchain:
  default: node
