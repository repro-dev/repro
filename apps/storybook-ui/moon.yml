id: repro/storybook-ui
language: typescript
layer: application
tags:
  - type.app
  - build.static
  - role.ui
tasks:
  build:
    command: pnpm run build
    deps:
      - ^:build
    outputs:
      - storybook-static
    options:
      cache: true
  dev:
    command: pnpm run storybook
    deps:
      - ^:build
toolchains:
  default: node
