id: repro
language: typescript
tasks:
  # ---------------------------------------------------------------------------
  # REP-1648 deterministic UI gates. Affected-only via moon ci target filtering
  # (verified: root-relative plain globs, no brace expansion — moon v2 forbids
  # `{a,b}` globs). Source globs are broad (`packages/*/src/**`) so ANY file
  # under them marks the task affected, including non-ts/tsx/mdx/css rendered
  # assets (svg, png, json, yml, less, …) that enumerated extension globs
  # would silently miss.
  #
  # Dependencies: the Storybook dev server and the route-smoke harness consume
  # gitignored generated artifacts (packages/domain/generated, packages/
  # wire-formats/generated) and built dists. The deps below guarantee those
  # exist even when the diff touches no package sources (e.g. scripts-only
  # PRs), because moon ci's :build phase only builds affected projects.
  #
  # options.cache: false — these tasks boot live servers and drive real
  # browsers; a cached pass/fail result from a previous run could mask a
  # change (e.g. an untracked baseline), so they always execute.
  #
  # The two Storybook-booting tasks share the :6099 port family. moon runs
  # independent tasks in parallel, so when BOTH are affected the dev servers
  # would race for the same port; the shared mutex serializes them whenever
  # both run, while keeping affected-only behavior (a mutex adds no
  # dependency edge — a task is still skipped entirely when unaffected).
  # ---------------------------------------------------------------------------
  ui-gates-visual-regression:
    command: bash scripts/visual-regression.sh --stories '[]' --fail-on-new
    deps:
      - repro/domain:build
      - repro/wire-formats:build
      - repro/tdl:build
    inputs:
      - glob: packages/*/src/**
        cache: true
      - glob: apps/*/src/**
        cache: true
      - glob: apps/*/index.html
        cache: true
      - glob: apps/*/vite.config.ts
        cache: true
      - glob: apps/storybook-ui/.storybook/**
        cache: true
      - glob: scripts/visual-regression-capture.ts
        cache: true
      - glob: scripts/visual-regression.sh
        cache: true
      - glob: tmp/visual-baselines/**
        cache: true
      - glob: pnpm-lock.yaml
        cache: true
    options:
      cache: false
      mutex: 'storybook-server'
  ui-gates-storybook:
    command: bash scripts/storybook-gates.sh
    deps:
      - repro/domain:build
      - repro/wire-formats:build
      - repro/tdl:build
    inputs:
      - glob: packages/*/src/**
        cache: true
      - glob: apps/*/src/**
        cache: true
      - glob: apps/*/index.html
        cache: true
      - glob: apps/*/vite.config.ts
        cache: true
      - glob: apps/storybook-ui/.storybook/**
        cache: true
      - glob: scripts/docs-page-checks.ts
        cache: true
      - glob: scripts/storybook-gates.sh
        cache: true
      - glob: tests/docs/**
        cache: true
      - glob: playwright.config.ts
        cache: true
      - glob: pnpm-lock.yaml
        cache: true
    options:
      cache: false
      mutex: 'storybook-server'
  ui-gates-route-smoke:
    command: bash scripts/route-smoke.sh
    deps:
      - repro/workspace:build
      - repro/admin:build
      - repro/domain:build
      - repro/wire-formats:build
      - repro/tdl:build
    inputs:
      - glob: tests/route-smoke/**
      - glob: packages/*/src/**
        cache: true
      - glob: apps/*/src/**
        cache: true
      - glob: apps/*/index.html
        cache: true
      - glob: apps/*/vite.config.ts
        cache: true
      - glob: apps/*/scripts/**
        cache: true
      - glob: scripts/route-smoke.sh
        cache: true
      - glob: playwright.config.ts
        cache: true
      - glob: pnpm-lock.yaml
        cache: true
    options:
      cache: false
  pen-export:
    command: pnpm run pen:export
    inputs:
    - glob: repro.pen
      cache: true
    - glob: scripts/pen-export.ts
      cache: true
    - glob: scripts/pen-export.json
      cache: true
    options:
      cache: true
      outputStyle: buffer-only-failure
toolchains:
  default: node
