apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrations
  labels:
    app: {{ .Release.Name }}-migrations
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: {{ .Values.migrations.image }}
          imagePullPolicy: Never
          command: ["moon", "run", "repro/api-server:migrate"]
          env:
          {{- range $key, $val := .Values.vars }}
            - name: {{ $key }}
              value: {{ $val | quote }}
          {{- end }}
