# A TOML plugin for proto that installs ctlptl from the tilt-dev/ctlptl GitHub release binaries.
# Replaces the asdf:ctlptl backend, which proto flags as unstable and which clones and runs a
# third-party asdf plugin at install time.
# https://moonrepo.dev/docs/proto/plugins#toml-plugin

name = "ctlptl"
type = "cli"

[platform.linux]
download-file = "ctlptl.{version}.linux.{arch}.tar.gz"
checksum-file = "checksums.txt"

[platform.macos]
download-file = "ctlptl.{version}.mac.{arch}.tar.gz"
checksum-file = "checksums.txt"

[install]
download-url = "https://github.com/tilt-dev/ctlptl/releases/download/v{version}/{download_file}"

[install.arch]
aarch64 = "arm64"

[resolve]
git-url = "https://github.com/tilt-dev/ctlptl"
