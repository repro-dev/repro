fileGroups:
  sharedGlobals: []
  default:
  - glob: '**/*'
    cache: true
  production: []
tasks:
  build:
    deps:
    - ^:build
    options:
      cache: true
      outputStyle: buffer-only-failure
  test:
    command: pnpm run test -- --test-timeout=30000 --test-force-exit
    deps:
    - ^:build
    - build
    env:
      NODE_OPTIONS: --test-reporter spec
    inputs:
    - glob: src/**/*.test.ts
      cache: true
    - glob: src/**/*.test.tsx
      cache: true
    options:
      cache: true
      outputStyle: buffer-only-failure
  typecheck:
    deps:
    - ^:build
    - build
    options:
      cache: true
      outputStyle: buffer-only-failure
inheritedBy:
  toolchain: node
