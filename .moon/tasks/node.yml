fileGroups:
  sharedGlobals: []
  default:
  - glob: '**/*'
    cache: true
  production: []
tasks:
  build:
    deps:
    - ^:build
    options:
      cache: true
      outputStyle: buffer-only-failure
  test:
    deps:
    - ^:build
    - build
    inputs:
    - glob: src/**/*.test.ts
      cache: true
    - glob: src/**/*.test.tsx
      cache: true
    options:
      cache: true
      outputStyle: buffer-only-failure
  typecheck:
    deps:
    - ^:build
    - build
    options:
      cache: true
      outputStyle: buffer-only-failure
inheritedBy:
  toolchain: node
