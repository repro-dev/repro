id: repro/agentic
language: typescript
layer: library
tags:
  - type.package
tasks:
  eval:
    command: tsx src/eval/index.ts
    deps:
      - ^:build
    inputs:
      - src/eval/**/*.ts
    env:
      OPENROUTER_API_KEY: $OPENROUTER_API_KEY
    options:
      cache: false
      runInCI: false
toolchains:
  default: node
