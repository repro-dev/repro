id: repro/agentic
language: typescript
layer: library
tags:
  - type.package
  - role.util
tasks:
  eval:
    command: tsx src/eval/index.ts
    deps:
      - ^:build
    inputs:
      - src/eval/**/*.ts
    env:
      OPENROUTER_API_KEY: $OPENROUTER_API_KEY
    options:
      cache: false
  apply-prompt-suggestions:
    command: tsx src/eval/applyPromptSuggestions.ts
    deps:
      - ^:build
    inputs:
      - src/eval/**/*.ts
    options:
      cache: false
toolchains:
  default: node
