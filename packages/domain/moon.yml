id: repro/domain
language: typescript
layer: library
tags:
  - type.package
  - role.util
tasks:
  build:
    command: pnpm run build
    deps:
      - ^:build
    inputs:
      - glob: src/**/*.tdls
        cache: true
    outputs:
      - generated/**/*
    options:
      cache: true
toolchains:
  default: node
